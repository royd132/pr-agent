[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffprism"
version = "0.1.0"
description = "Evidence-first multi-agent pull request review"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.1,<4",
  "redis>=5,<7",
  "PyJWT[crypto]>=2.8,<3",
  "opentelemetry-sdk>=1.24,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.24,<2",
  "PyYAML>=5.4,<7",
]

[project.scripts]
diffprism = "diffprism.__main__:main"

[tool.setuptools.packages.find]
include = ["diffprism*", "evoagent*"]

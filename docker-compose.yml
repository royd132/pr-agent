services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diffprism
      POSTGRES_USER: diffprism
      POSTGRES_PASSWORD: ${DIFFPRISM_POSTGRES_PASSWORD:?set DIFFPRISM_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diffprism"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  diffprism:
    build: .
    ports:
      - "8080:8080"
    environment:
      DIFFPRISM_HOST: 0.0.0.0
      DIFFPRISM_DATABASE_URL: postgresql://diffprism:${DIFFPRISM_POSTGRES_PASSWORD}@postgres:5432/diffprism
      DIFFPRISM_REDIS_URL: redis://redis:6379/0
      DIFFPRISM_ASYNC_WORKERS: 4
      DIFFPRISM_SKILLS_DIR: /app/skills
      DIFFPRISM_AUTH_REQUIRED: "true"
      DIFFPRISM_AUTH_SECRET: ${DIFFPRISM_AUTH_SECRET:?set DIFFPRISM_AUTH_SECRET}
      DIFFPRISM_BOOTSTRAP_ADMIN_USERNAME: ${DIFFPRISM_BOOTSTRAP_ADMIN_USERNAME:-admin}
      DIFFPRISM_BOOTSTRAP_ADMIN_PASSWORD: ${DIFFPRISM_BOOTSTRAP_ADMIN_PASSWORD:?set DIFFPRISM_BOOTSTRAP_ADMIN_PASSWORD}
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

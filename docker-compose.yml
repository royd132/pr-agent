services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tracereview
      POSTGRES_USER: tracereview
      POSTGRES_PASSWORD: tracereview-local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracereview"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  tracereview:
    build: .
    ports:
      - "8080:8080"
    environment:
      TRACEREVIEW_HOST: 0.0.0.0
      TRACEREVIEW_DATABASE_URL: postgresql://tracereview:tracereview-local@postgres:5432/tracereview
      TRACEREVIEW_REDIS_URL: redis://redis:6379/0
      TRACEREVIEW_ASYNC_WORKERS: 4
      TRACEREVIEW_SKILLS_DIR: /app/skills
      TRACEREVIEW_AUTH_REQUIRED: "true"
      TRACEREVIEW_AUTH_SECRET: ${TRACEREVIEW_AUTH_SECRET:-local-only-change-this-secret-123456}
      TRACEREVIEW_BOOTSTRAP_ADMIN_USERNAME: ${TRACEREVIEW_BOOTSTRAP_ADMIN_USERNAME:-admin}
      TRACEREVIEW_BOOTSTRAP_ADMIN_PASSWORD: ${TRACEREVIEW_BOOTSTRAP_ADMIN_PASSWORD:-tracereview-local-admin}
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
